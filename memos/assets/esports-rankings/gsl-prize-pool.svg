<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Prize pool per season of the Global StarCraft II League</title>
  <desc id="desc">Per-season GSL prize pools fell from $140,000 in 2020 to about $25,800 in 2023 and about $14,600 in 2024. The crowdfunded 2026 seasons carried $15,000.</desc>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="72" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111111">Prize pool per season, Global StarCraft II League</text>
  <text x="72" y="70" font-family="Arial, sans-serif" font-size="15" fill="#555555">Regular Code S seasons only; Super Tournaments excluded. 2025 seasons are absent from the source database.</text>
  <g stroke="#dedede" stroke-width="1">
    <line x1="80" y1="420" x2="1140" y2="420"/><line x1="80" y1="307" x2="1140" y2="307"/>
    <line x1="80" y1="193" x2="1140" y2="193"/><line x1="80" y1="80" x2="1140" y2="80"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#555555" text-anchor="end">
    <text x="67" y="425">$0</text><text x="67" y="312">$50k</text><text x="67" y="198">$100k</text><text x="67" y="85">$150k</text>
  </g>
  <g fill="#2f80ed">
    <rect x="85" y="103" width="90" height="317"/>
    <rect x="243" y="153" width="90" height="267"/>
    <rect x="402" y="141" width="90" height="279"/>
    <rect x="560" y="362" width="90" height="58"/>
    <rect x="718" y="387" width="90" height="33"/>
  </g>
  <rect x="1035" y="386" width="90" height="34" fill="#7a1c14"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle" font-weight="700">
    <text x="130" y="93">$140,000</text>
    <text x="288" y="143">$118,000</text>
    <text x="447" y="131">$123,000</text>
    <text x="605" y="352">$25,800</text>
    <text x="763" y="377">$14,600</text>
    <text x="1080" y="376" fill="#7a1c14">$15,000</text>
  </g>
  <text x="922" y="410" font-family="Arial, sans-serif" font-size="14" fill="#999999" text-anchor="middle">no data</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#555555" text-anchor="middle">
    <text x="130" y="447">2020</text><text x="288" y="447">2021</text><text x="447" y="447">2022</text>
    <text x="605" y="447">2023</text><text x="763" y="447">2024</text><text x="922" y="447">2025</text><text x="1080" y="447">2026</text>
  </g>
  <text x="1080" y="468" font-family="Arial, sans-serif" font-size="13" fill="#7a1c14" text-anchor="middle" font-weight="700">crowdfunded</text>
  <text x="72" y="505" font-family="Arial, sans-serif" font-size="13" fill="#777777">Sources: Esports Earnings league event records for 2020–2024; Liquipedia and e-rankings for the 2026 seasons. Figures are per season.</text>
</svg>
