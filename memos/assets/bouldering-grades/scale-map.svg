<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Illustrative bouldering grade scale comparison"><rect width="1200" height="430" fill="#f8f7f2"/><g font-family="Arial,sans-serif" fill="#171717"><text x="60" y="58" font-family="Georgia,serif" font-size="31">Grades are local consensus, not a universal measurement</text><text x="100" y="125" font-size="25" font-weight="700">V scale</text><text x="650" y="125" font-size="25" font-weight="700">Font scale</text><line x1="120" y1="190" x2="510" y2="190" stroke="#222" stroke-width="4"/><line x1="670" y1="190" x2="1060" y2="190" stroke="#222" stroke-width="4"/><g fill="#7a1c14"><circle cx="150" cy="190" r="12"/><circle cx="230" cy="190" r="12"/><circle cx="310" cy="190" r="12"/><circle cx="390" cy="190" r="12"/><circle cx="470" cy="190" r="12"/><circle cx="700" cy="190" r="12"/><circle cx="780" cy="190" r="12"/><circle cx="860" cy="190" r="12"/><circle cx="940" cy="190" r="12"/><circle cx="1020" cy="190" r="12"/></g><g font-size="23"><text x="130" y="240">VB</text><text x="210" y="240">V0</text><text x="290" y="240">V2</text><text x="370" y="240">V4</text><text x="450" y="240">V6+</text><text x="682" y="240">4</text><text x="762" y="240">5</text><text x="838" y="240">6A</text><text x="918" y="240">6B+</text><text x="998" y="240">7A+</text></g><text x="60" y="335" font-size="22">Approximate cross-system comparisons are useful for orientation only.</text><text x="60" y="370" font-size="22">Style, conditions, beta, body geometry, and local calibration can move the lived difficulty.</text></g></svg>
