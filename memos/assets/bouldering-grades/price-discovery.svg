<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">How long a proposed boulder grade goes unchecked</title>
<desc id="desc">Burden of Dreams was first climbed in October 2016 and first repeated in April 2023, six and a half years later. Soudain Seul was established in 2021, downgraded on its second ascent and re-confirmed by a later one. Exodia, the only proposed 9A plus, was climbed in November 2025 and remains unrepeated.</desc>
<rect width="1000" height="430" fill="#ffffff"/>
<text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">At the top of the scale, a grade is one person&#8217;s opinion for years</text>
<text x="60" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Interval between a proposed grade and an independent check, for three benchmark boulder problems</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">
<rect x="60" y="80" width="26" height="10" fill="#d9c9a3"/><text x="94" y="90">Grade unsettled</text>
<circle cx="238" cy="85" r="5.5" fill="#111111"/><text x="250" y="90">First ascent</text>
<circle cx="368" cy="85" r="5.5" fill="#7a1c14"/><text x="380" y="90">Independent repeat</text>
</g>
<text x="60" y="163" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Burden of Dreams</text>
<text x="60" y="181" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777">Lappnor, Finland &#183; 9A / V17</text>
<rect x="373.5" y="156" width="357.2" height="14" fill="#d9c9a3"/>
<circle cx="373.5" cy="163.0" r="5.5" fill="#111111"/>
<circle cx="730.7" cy="163.0" r="5.5" fill="#7a1c14"/>
<text x="375.5" y="192.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Six and a half years to a first repeat, which confirmed the grade</text>
<text x="60" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Soudain Seul</text>
<text x="60" y="261" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777">Fontainebleau, France &#183; 8C+ / 9A</text>
<rect x="627.2" y="236" width="302.8" height="14" fill="#d9c9a3"/>
<path d="M 928.0 232 L 943.0 243 L 928.0 254 Z" fill="#d9c9a3"/>
<circle cx="627.2" cy="243.0" r="5.5" fill="#111111"/>
<text x="522.4" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Downgraded on the second ascent, re-confirmed by a later one</text>
<text x="60" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">Exodia</text>
<text x="60" y="341" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777">Rifugio di Barbara, Italy &#183; proposed 9A+ / V18</text>
<rect x="873.3" y="316" width="56.7" height="14" fill="#d9c9a3"/>
<path d="M 928.0 312 L 943.0 323 L 928.0 334 Z" fill="#d9c9a3"/>
<circle cx="873.3" cy="323.0" r="5.5" fill="#111111"/>
<text x="508.5" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Unrepeated: the hardest grade in the world rests on one ascent</text>
<line x1="330.0" y1="368" x2="930.0" y2="368" stroke="#cccccc"/>
<line x1="330.0" y1="368" x2="330.0" y2="374" stroke="#cccccc"/>
<text x="330.0" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2016</text>
<line x1="440.1" y1="368" x2="440.1" y2="374" stroke="#cccccc"/>
<text x="440.1" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2018</text>
<line x1="550.2" y1="368" x2="550.2" y2="374" stroke="#cccccc"/>
<text x="550.2" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2020</text>
<line x1="660.3" y1="368" x2="660.3" y2="374" stroke="#cccccc"/>
<text x="660.3" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2022</text>
<line x1="770.4" y1="368" x2="770.4" y2="374" stroke="#cccccc"/>
<text x="770.4" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2024</text>
<line x1="880.5" y1="368" x2="880.5" y2="374" stroke="#cccccc"/>
<text x="880.5" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#777777" text-anchor="middle">2026</text>
<text x="60" y="412" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#888888">Of roughly fifteen boulders proposed at V17/9A, about eight had no confirming repeat as of late 2025.</text>
<text x="60" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#888888">There is no official register; counts come from reported ascents.</text>
</svg>