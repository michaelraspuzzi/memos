<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Timeline of University of Paris institutional milestones"><rect width="1200" height="310" fill="#f8f7f2"/><text x="60" y="58" font-family="Georgia,serif" font-size="30" fill="#171717">The bachelor’s degree emerged with the university</text><line x1="115" y1="170" x2="1085" y2="170" stroke="#222" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#171717"><circle cx="210" cy="170" r="13" fill="#7a1c14"/><text x="160" y="130" font-size="26" font-weight="700">c. 1200</text><text x="98" y="220" font-size="21">Paris receives</text><text x="98" y="246" font-size="21">royal protections</text><circle cx="510" cy="170" r="13" fill="#7a1c14"/><text x="470" y="130" font-size="26" font-weight="700">1215</text><text x="435" y="220" font-size="21">Statutes regulate</text><text x="435" y="246" font-size="21">teaching in arts</text><circle cx="820" cy="170" r="13" fill="#7a1c14"/><text x="776" y="130" font-size="26" font-weight="700">1231</text><text x="729" y="220" font-size="21">Papal bull confirms</text><text x="729" y="246" font-size="21">university privileges</text><circle cx="1050" cy="170" r="13" fill="#7a1c14"/><text x="1006" y="130" font-size="26" font-weight="700">Later</text><text x="968" y="220" font-size="21">BA standardizes</text><text x="973" y="246" font-size="21">and travels</text></g></svg>
