<text x="60" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#888888">Published budgets: Harvard GSD registrar 2026&#8211;27 ($104,802/yr) and HBS MS/MBA 2026&#8211;27 ($147,332/yr).</text>
<text x="60" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#888888">Scholarship: HBS reports ~50% of MBA students receive a need-based award averaging $100,000 over two years.</text>
