<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Two-year cost of Harvard MDE and MS/MBA including forgone salary</title>
<desc id="desc">MDE: about 210,000 dollars in published budget plus 300,000 dollars of forgone salary, totalling about 510,000 dollars. MS/MBA: about 295,000 dollars in published budget plus 300,000 dollars forgone, totalling about 595,000 dollars, reduced to about 495,000 dollars for the roughly half of HBS students who receive a need-based scholarship averaging 100,000 dollars over two years.</desc>
<rect width="1000" height="400" fill="#ffffff"/>
<text x="60" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">After aid, the cheaper-looking degree is the more expensive one</text>
<text x="60" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Two-year cost of attendance at published 2026&#8211;27 rates held flat, plus an assumed $150,000 a year of forgone salary</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">
<rect x="60" y="80" width="14" height="12" fill="#111111"/><text x="80" y="91">Published budget (tuition, fees, living)</text>
<rect x="330" y="80" width="14" height="12" fill="#cfcfcf"/><text x="350" y="91">Forgone salary (assumption)</text>
<rect x="560" y="80" width="14" height="12" fill="#ffffff" stroke="#7a1c14" stroke-width="1.5"/><text x="580" y="91">Typical HBS need-based scholarship</text>
</g>
