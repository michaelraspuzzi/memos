<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Comparison of Harvard MDE and MS MBA"><rect width="1200" height="560" fill="#f8f7f2"/><g font-family="Georgia,serif" fill="#171717"><text x="60" y="55" font-size="31">Two cross-school programs; different founder jobs</text><rect x="60" y="105" width="500" height="380" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><rect x="640" y="105" width="500" height="380" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="90" y="155" font-size="31" font-weight="700">MDE</text><text x="90" y="195" font-size="22">GSD + SEAS</text><text x="90" y="255" font-size="25">Find the right problem</text><text x="90" y="294" font-size="22">studio → systems → prototype</text><text x="90" y="333" font-size="22">stakeholders → IDEP → evidence</text><text x="90" y="412" font-size="22" fill="#7a1c14">Output: an intervention</text><text x="670" y="155" font-size="31" font-weight="700">MS/MBA</text><text x="670" y="195" font-size="22">HBS + SEAS</text><text x="670" y="255" font-size="25">Build the company around it</text><text x="670" y="294" font-size="22">engineering + management</text><text x="670" y="333" font-size="22">technical depth + business network</text><text x="670" y="412" font-size="22" fill="#7a1c14">Output: MBA + MS degrees</text></g></svg>
