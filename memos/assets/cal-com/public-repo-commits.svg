<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Monthly commits to Cal.com's public repository, October 2025 to August 2026</title>
  <desc id="desc">Public repository commits peaked at 618 in January 2026, fell to 69 in April when the commercial code moved private, and ranged from 4 to 30 per month from May through August.</desc>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Public-repository development fell after the commercial code split</text>
  <text x="70" y="57" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Monthly commits to calcom/cal.diy (the repository was calcom/cal.com before April 14, 2026)</text>
  <g stroke="#dddddd" stroke-width="1"><line x1="70" y1="340" x2="950" y2="340"/><line x1="70" y1="254" x2="950" y2="254"/><line x1="70" y1="168" x2="950" y2="168"/><line x1="70" y1="82" x2="950" y2="82"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="end"><text x="60" y="344">0</text><text x="60" y="258">200</text><text x="60" y="172">400</text><text x="60" y="86">600</text></g>
  <rect x="632" y="82" width="318" height="258" fill="#f4f4f2"/>
  <line x1="632" y1="72" x2="632" y2="340" stroke="#7a1c14" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="641" y="93" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7a1c14">Apr. 14: production code moves private</text>
  <polyline points="80,222 166,233 252,128 338,74 424,209 510,301 596,310 682,337 768,327 854,334 940,338" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#111111" stroke-width="2"><circle cx="80" cy="222" r="4"/><circle cx="166" cy="233" r="4"/><circle cx="252" cy="128" r="4"/><circle cx="338" cy="74" r="4"/><circle cx="424" cy="209" r="4"/><circle cx="510" cy="301" r="4"/><circle cx="596" cy="310" r="4"/><circle cx="682" cy="337" r="4"/><circle cx="768" cy="327" r="4"/><circle cx="854" cy="334" r="4"/><circle cx="940" cy="338" r="4"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333" text-anchor="middle"><text x="80" y="374">Oct.</text><text x="166" y="374">Nov.</text><text x="252" y="374">Dec.</text><text x="338" y="374">Jan.</text><text x="424" y="374">Feb.</text><text x="510" y="374">Mar.</text><text x="596" y="374">Apr.</text><text x="682" y="374">May</text><text x="768" y="374">Jun.</text><text x="854" y="374">Jul.</text><text x="940" y="374">Aug.*</text></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><text x="80" y="392">2025</text><text x="338" y="392">2026</text></g>
  <text x="70" y="424" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#666666">*August through Aug. 26. Counts include merge commits. Source: GitHub REST API.</text>
</svg>
