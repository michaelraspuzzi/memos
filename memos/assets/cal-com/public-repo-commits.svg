<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Monthly commits to Cal.com's public repository by author affiliation, October 2025 to August 2026</title>
  <desc id="desc">Commits from Cal.com-affiliated authors peaked at 508 in January 2026, fell to 40 in March before the April 14 closure announcement, and reached zero by July. Commits from external contributors ranged from 44 to 91 per month before the split and from 4 to 26 per month after it.</desc>
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">Cal.com's engineers left the public repository before the announcement</text>
  <text x="70" y="57" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555">Monthly commits to calcom/cal.com (renamed cal.diy on April 15, 2026) by author affiliation</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">
    <line x1="70" y1="76" x2="98" y2="76" stroke="#111111" stroke-width="3"/><text x="104" y="80">Cal.com-affiliated authors</text>
    <line x1="290" y1="76" x2="318" y2="76" stroke="#7a1c14" stroke-width="3"/><text x="324" y="80">External contributors</text>
  </g>
  <g stroke="#dddddd" stroke-width="1"><line x1="70" y1="340" x2="950" y2="340"/><line x1="70" y1="254" x2="950" y2="254"/><line x1="70" y1="168" x2="950" y2="168"/><line x1="70" y1="82" x2="950" y2="82"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666" text-anchor="end"><text x="60" y="344">0</text><text x="60" y="258">200</text><text x="60" y="172">400</text><text x="60" y="86">600</text></g>
  <rect x="632" y="88" width="318" height="252" fill="#f4f4f2"/>
  <line x1="632" y1="88" x2="632" y2="340" stroke="#7a1c14" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="641" y="103" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7a1c14">Apr. 14: production code moves private</text>
  <polyline points="80,246 166,254 252,171 338,122 424,239 510,323 596,321 682,338 768,338 854,340 940,340" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="80,319 166,321 252,301 338,301 424,312 510,320 596,330 682,338 768,329 854,334 940,338" fill="none" stroke="#7a1c14" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#111111" stroke-width="2"><circle cx="80" cy="246" r="4"/><circle cx="166" cy="254" r="4"/><circle cx="252" cy="171" r="4"/><circle cx="338" cy="122" r="4"/><circle cx="424" cy="239" r="4"/><circle cx="510" cy="323" r="4"/><circle cx="596" cy="321" r="4"/><circle cx="682" cy="338" r="4"/><circle cx="768" cy="338" r="4"/><circle cx="854" cy="340" r="4"/><circle cx="940" cy="340" r="4"/></g>
  <g fill="#ffffff" stroke="#7a1c14" stroke-width="2"><circle cx="80" cy="319" r="4"/><circle cx="166" cy="321" r="4"/><circle cx="252" cy="301" r="4"/><circle cx="338" cy="301" r="4"/><circle cx="424" cy="312" r="4"/><circle cx="510" cy="320" r="4"/><circle cx="596" cy="330" r="4"/><circle cx="682" cy="338" r="4"/><circle cx="768" cy="329" r="4"/><circle cx="854" cy="334" r="4"/><circle cx="940" cy="338" r="4"/></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333" text-anchor="middle"><text x="80" y="374">Oct.</text><text x="166" y="374">Nov.</text><text x="252" y="374">Dec.</text><text x="338" y="374">Jan.</text><text x="424" y="374">Feb.</text><text x="510" y="374">Mar.</text><text x="596" y="374">Apr.</text><text x="682" y="374">May</text><text x="768" y="374">Jun.</text><text x="854" y="374">Jul.</text><text x="940" y="374">Aug.</text></g>
  <text x="70" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">Source: GitHub REST API, checked Aug. 27, 2026. Affiliation from GitHub profiles, org membership, and commit emails; bots excluded. August runs through Aug. 26.</text>
</svg>
